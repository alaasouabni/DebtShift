name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Scan production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Scan changed commits for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_VERSION: 8.30.1
      - name: Scan full Git history for secrets
        run: gitleaks detect --source . --config gitleaks.toml --redact --no-banner --exit-code 1
      - name: Build production container
        run: docker build --file infra/docker/Dockerfile --tag debtshift-app:ci .
      - name: Scan production container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: debtshift-app:ci
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
          hide-progress: true
          timeout: 10m0s
      - name: Generate runtime SBOM
        run: trivy image --quiet --scanners vuln --format cyclonedx --output debtshift-app.cdx.json debtshift-app:ci
      - name: Upload runtime SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debtshift-runtime-sbom
          path: debtshift-app.cdx.json
          if-no-files-found: error
          retention-days: 30

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check

  evm-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:evm
      - run: npm run check:evm-deployment
      - run: npm run test --workspace @debtshift/api
      - run: npm run test --workspace @debtshift/worker
      - run: npm run demo:happy
      - run: npm run demo:recovery

  near-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev nasm pkg-config
      - uses: actions/cache@v4
        id: cargo-near-cache
        with:
          path: ~/.cargo/bin/cargo-near
          key: cargo-near-${{ runner.os }}-0.23.0-rust-1.95.0
      - if: steps.cargo-near-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-near --version 0.23.0 --locked
      - run: npm run check:near
