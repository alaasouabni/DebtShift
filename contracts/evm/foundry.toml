[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
bytecode_hash = "none"
fuzz = { runs = 1_000 }
invariant = { runs = 256, depth = 64, fail_on_revert = true }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
