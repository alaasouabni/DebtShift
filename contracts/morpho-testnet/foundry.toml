[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["vendor"]
remappings = ["morpho-blue/=vendor/morpho-blue/"]
solc = "0.8.19"
evm_version = "paris"
via_ir = true
optimizer = true
optimizer_runs = 999_999
bytecode_hash = "none"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
